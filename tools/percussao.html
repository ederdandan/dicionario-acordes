<!doctype html>
<meta charset="utf-8">
<title>Gerar percussão</title>
<!-- Usado por tools/build-percussion.mjs: decodifica as fontes e devolve cada golpe recortado em WAV (mono, 32 kHz, 16 bits). -->
<script>
const RATE = 32000;

/** Golpes do arquivo: inícios onde o envelope sobe acima de 25% do pico após ≥ 60 ms abaixo de 8%. */
function onsets(d, sr) {
  let peak = 0;
  for (const x of d) peak = Math.max(peak, Math.abs(x));
  const hop = Math.round(sr * 0.002), quiet = Math.round(0.06 / 0.002), out = [];
  let below = quiet;
  for (let i = 0; i < d.length; i += hop) {
    let m = 0;
    for (let k = i; k < Math.min(d.length, i + hop); k++) m = Math.max(m, Math.abs(d[k]));
    if (m > peak * 0.25 && below >= quiet) {
      let j = i; // recua até o começo real do som
      while (j > 0 && Math.abs(d[j]) > peak * 0.01) j--;
      let p = 0;
      for (let k = i; k < Math.min(d.length, i + sr * 0.05); k++) p = Math.max(p, Math.abs(d[k]));
      out.push({ at: j, peak: p });
      below = 0;
    } else if (m < peak * 0.08) below++;
  }
  return { list: out, peak };
}

function wav(data) {
  const b = new ArrayBuffer(44 + data.length * 2), v = new DataView(b);
  const s = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  s(0, 'RIFF'); v.setUint32(4, 36 + data.length * 2, true); s(8, 'WAVEfmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, RATE, true); v.setUint32(28, RATE * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); s(36, 'data'); v.setUint32(40, data.length * 2, true);
  data.forEach((x, i) => v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, x)) * 32767, true));
  let bin = '';
  new Uint8Array(b).forEach(c => { bin += String.fromCharCode(c); });
  return btoa(bin);
}

async function processOne({ src, secs, pick }) {
  const raw = await (await fetch(src)).arrayBuffer();
  const buf = await new OfflineAudioContext(1, 1, 44100).decodeAudioData(raw);
  // mono
  const mono = new Float32Array(buf.length);
  for (let c = 0; c < buf.numberOfChannels; c++) buf.getChannelData(c).forEach((x, i) => { mono[i] += x / buf.numberOfChannels; });
  const { list } = onsets(mono, buf.sampleRate);
  const sorted = [...list].sort((a, b) => b.peak - a.peak);
  if (!sorted.length) throw new Error(`nenhum golpe em ${src} (${buf.length} amostras)`);
  const hit = pick === 'medio' ? sorted.find(h => h.peak < sorted[0].peak * 0.6) || sorted[Math.floor(sorted.length / 2)] : sorted[0];
  const start = Math.max(0, hit.at - Math.round(buf.sampleRate * 0.001));
  const len = Math.min(buf.length - start, Math.round(buf.sampleRate * secs));
  // reamostra para 32 kHz
  const off = new OfflineAudioContext(1, Math.ceil(len * RATE / buf.sampleRate), RATE);
  const cut = off.createBuffer(1, len, buf.sampleRate);
  cut.getChannelData(0).set(mono.subarray(start, start + len));
  const s = off.createBufferSource();
  s.buffer = cut; s.connect(off.destination); s.start();
  const out = (await off.startRendering()).getChannelData(0);
  // normaliza (pico 0,9) e fade final de 20% (máx. 60 ms) para não estalar
  let p = 0;
  for (const x of out) p = Math.max(p, Math.abs(x));
  const fade = Math.min(Math.round(out.length * 0.2), Math.round(RATE * 0.06));
  return Array.from(out, (x, i) => (x / (p || 1)) * 0.9 * (i > out.length - fade ? (out.length - i) / fade : 1));
}

async function processAll(jobs) {
  const res = {};
  for (const j of jobs) res[j.out] = wav(await processOne(j));
  return res;
}
</script>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testes — Dicionário de Acordes</title>
  <link rel="stylesheet" href="./css/app.css">
  <style>
    main { max-width: 900px; margin: 0 auto; padding: 16px; }
    .ok { color: #2e7d32; } .fail { color: #c62828; font-weight: 600; }
    li { margin: 2px 0; } code { font-size: .9em; }
    #resumo { font-size: 1.2rem; font-weight: 700; }
  </style>
</head>
<body>
<main>
  <h1>Testes dos critérios de aceite — Fases 1 a 3</h1>
  <p id="resumo">Rodando…</p>
  <ol id="resultados"></ol>
  <h2>Validação do <code>curated.js</code></h2>
  <ul id="curados"></ul>
</main>
<script type="module">
import { parseChord } from './js/parser.js';
import { chordNotes, CHORD_TYPES, ROOT_GRID, noteToMidi } from './js/theory.js';
import { getVoicings, checkShape, curatedFor, curatedReport } from './js/voicings.js';
import { INSTRUMENTS } from './js/instruments.js';
import { renderDiagram } from './js/diagram.js';
import { play, setContext, activeVoices, voicesFor, ksSamples } from './js/audio.js';

const results = [];
const report = (name, ok, detail = '') => {
  results.push({ name, ok, detail });
  (ok ? console.log : console.error)(`${ok ? '✔' : '✘'} ${name}${detail ? ' — ' + detail : ''}`);
};
const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const fmt = v => v.frets.map(f => (f < 0 ? 'x' : f)).join('');
const V = sym => getVoicings(parseChord(sym), 'violao', 'padrao', { max: 8 });
const courses = INSTRUMENTS.violao.tunings.padrao.courses.map(c => ({ pc: noteToMidi(c.notes[0]) % 12, low: noteToMidi(c.notes[0]) }));
const sounding = v => v.frets.map((f, i) => (f < 0 ? null : { pc: (courses[i].pc + f) % 12, midi: courses[i].low + f })).filter(Boolean);

// 1) Geração completa (primeiro, sem cache): todos os tipos × 12 tônicas
{
  const t0 = performance.now();
  const sem = [];
  for (const r of ROOT_GRID) for (const t of CHORD_TYPES) {
    const c = parseChord(r + t.q);
    if (!c || !getVoicings(c, 'violao', 'padrao').length) sem.push(r + t.q);
  }
  const ms = performance.now() - t0;
  report(`Todos os ${CHORD_TYPES.length} tipos × 12 tônicas têm ≥ 1 posição`, sem.length === 0, sem.join(', '));
  report('Geração completa < 2 s', ms < 2000, `${ms.toFixed(0)} ms`);
}

// 2) Parser
const P = (txt, exp) => {
  const got = parseChord(txt);
  const ok = exp === null ? got === null : got && Object.entries(exp).every(([k, v]) => got[k] === v);
  report(`parseChord("${txt}")`, !!ok, JSON.stringify(got));
};
P('Fá#m7', { symbol: 'F#m7' });
P('Dó menor', { symbol: 'Cm' });
P('Bbmaj7', { symbol: 'Bb7M' });
P('G7b9', { symbol: 'G7(b9)' });
P('D/F#', { symbol: 'D/F#', bass: 'F#' });
P('xyz', null);
P('Si bemol maior', { symbol: 'Bb' });
P('Am/G', { symbol: 'Am/G', bass: 'G' });
P('Cø', { symbol: 'Cm7(b5)' });
P('C6/9', { symbol: 'C6/9', bass: null });

// 3) Notas e grafia
const N = (sym, names) => {
  const got = chordNotes(parseChord(sym)).names;
  report(`Notas de ${sym}`, eq(got, names), got.join(' '));
};
N('C7', ['Dó', 'Mi', 'Sol', 'Sib']);
N('E', ['Mi', 'Sol#', 'Si']);
N('Bb7M', ['Sib', 'Ré', 'Fá', 'Lá']);

// 4) Primeira posição no violão
const FIRST = { C: ['x32010'], G: ['320003', '320033'], D: ['xx0232'], Am: ['x02210'], E: ['022100'], F: ['133211'], Bm: ['x24432'] };
for (const [sym, exp] of Object.entries(FIRST)) {
  const v = V(sym)[0];
  report(`1ª posição de ${sym} ∈ {${exp.join(', ')}}`, !!v && exp.includes(fmt(v)), v ? `${fmt(v)} (${v.label})` : 'nenhuma');
}
{
  const f = V('F')[0], bm = V('Bm')[0];
  report('F: pestana na 1ª casa', f.barres.some(b => b.fret === 1), JSON.stringify(f.barres));
  report('Bm: pestana na 2ª casa', bm.barres.some(b => b.fret === 2), JSON.stringify(bm.barres));
}

// 5) G/B — Si é a nota mais grave em todas as posições
{
  const vs = V('G/B');
  const bad = vs.filter(v => { const s = sounding(v); return s.reduce((a, b) => (b.midi < a.midi ? b : a)).pc !== 11; });
  report(`G/B: baixo em Si nas ${vs.length} posições`, vs.length > 0 && !bad.length, bad.map(fmt).join(', '));
}

// 6) C13 — 3ª, 7b e 13ª em todas as posições
{
  const vs = V('C13');
  const bad = vs.filter(v => { const pcs = new Set(sounding(v).map(s => s.pc)); return ![4, 10, 9].every(pc => pcs.has(pc)); });
  report(`C13: 3ª, 7b e 13ª nas ${vs.length} posições`, vs.length > 0 && !bad.length, bad.map(fmt).join(', '));
}

// ---------- Fase 2: Viola Caipira e Ukulele ----------
const ALL = Object.values(INSTRUMENTS).flatMap(i => Object.keys(i.tunings).map(t => [i.id, t]));

// 8) Todos os tipos × 12 tônicas em cada instrumento/afinação
for (const [i, t] of ALL) {
  if (i === 'violao') continue; // já coberto no teste 1
  const t0 = performance.now();
  const sem = [];
  for (const r of ROOT_GRID) for (const ty of CHORD_TYPES) {
    if (!getVoicings(parseChord(r + ty.q), i, t).length) sem.push(r + ty.q);
  }
  report(`${INSTRUMENTS[i].name} / ${INSTRUMENTS[i].tunings[t].name}: todos os tipos × 12 tônicas têm ≥ 1 posição`, sem.length === 0,
    `${sem.join(', ')} (${(performance.now() - t0).toFixed(0)} ms)`);
}

// 9) Primeira posição na viola e no ukulele
const FIRST2 = [
  ['viola', 'cebolaoMi', 'E', '00000'], ['viola', 'cebolaoRe', 'D', '00000'], ['viola', 'rioAbaixo', 'G', '00000'],
  ['ukulele', 'highG', 'C', '0003'], ['ukulele', 'highG', 'G', '0232'], ['ukulele', 'highG', 'Am', '2000'],
  ['ukulele', 'highG', 'F', '2010'], ['ukulele', 'highG', 'G7', '0212'],
];
for (const [i, t, sym, exp] of FIRST2) {
  const v = getVoicings(parseChord(sym), i, t)[0];
  report(`${INSTRUMENTS[i].tunings[t].name}: 1ª posição de ${sym} = ${exp}`, !!v && fmt(v) === exp, v ? `${fmt(v)} (${v.label})` : 'nenhuma');
}

// 10) Regras de baixo
const crs = (i, t) => INSTRUMENTS[i].tunings[t].courses.map(c => ({ pc: noteToMidi(c.notes[0]) % 12 }));
const firstPc = (v, cs) => { const k = v.frets.findIndex(f => f >= 0); return (cs[k].pc + v.frets[k]) % 12; };
{
  const cs = crs('ukulele', 'highG');
  const vs = getVoicings(parseChord('C/E'), 'ukulele', 'highG');
  const bad = vs.filter(v => firstPc(v, cs) !== 4);
  report(`Ukulele C/E: Mi na corda mais grossa tocada nas ${vs.length} posições`, vs.length > 0 && !bad.length, bad.map(fmt).join(', '));
  const c13 = getVoicings(parseChord('C13'), 'ukulele', 'highG');
  const badC13 = c13.filter(v => { const p = new Set(v.frets.map((f, k) => (f < 0 ? -1 : (cs[k].pc + f) % 12))); return ![4, 10, 9].every(x => p.has(x)); });
  report(`Ukulele C13: 3ª, 7b e 13ª nas ${c13.length} posições`, c13.length > 0 && !badC13.length, badC13.map(fmt).join(', '));
}
{
  const cs = crs('viola', 'cebolaoMi');
  const vs = getVoicings(parseChord('E/G#'), 'viola', 'cebolaoMi');
  const bad = vs.filter(v => firstPc(v, cs) !== 8);
  report(`Viola (Cebolão Mi) E/G#: Sol# no par mais grave tocado nas ${vs.length} posições`, vs.length > 0 && !bad.length, bad.map(fmt).join(', '));
  const am = getVoicings(parseChord('Am'), 'viola', 'cebolaoMi');
  const badAm = am.filter(v => ![9, 4].includes(firstPc(v, cs)));
  report(`Viola Am: baixo na tônica ou na 5ª (sem barra) nas ${am.length} posições`, am.length > 0 && !badAm.length, badAm.map(fmt).join(', '));
}

// 11) Troca de instrumento/afinação recalcula diagrama, legenda e posições
{
  const c = parseChord('G');
  const a = getVoicings(c, 'viola', 'cebolaoMi'), b = getVoicings(c, 'viola', 'rioAbaixo'), u = getVoicings(c, 'ukulele', 'highG');
  report('Posições de G mudam entre Cebolão Mi, Rio Abaixo e Ukulele', fmt(a[0]) !== fmt(b[0]) && u[0].frets.length === 4 && a[0].frets.length === 5,
    `${fmt(a[0])} · ${fmt(b[0])} · ${fmt(u[0])}`);
  const svgV = renderDiagram(b[0], INSTRUMENTS.viola, INSTRUMENTS.viola.tunings.rioAbaixo);
  const txt = [...svgV.querySelectorAll('text')].map(t => t.textContent);
  report('Diagrama da viola: legenda de pares (5º…1º, oitavado/uníssono)', ['5º', '1º', '8ª', '='].every(x => txt.includes(x)) && svgV.getAttribute('aria-label').includes('Rio Abaixo'), svgV.getAttribute('aria-label'));
  const svgU = renderDiagram(u[0], INSTRUMENTS.ukulele, INSTRUMENTS.ukulele.tunings.highG);
  const utxt = [...svgU.querySelectorAll('text')].map(t => t.textContent);
  report('Diagrama do ukulele: 4 colunas, sem legenda de pares', u[0].courseNotes.length === 4 && !utxt.includes('8ª'), svgU.getAttribute('aria-label'));
}

// 7) Validação automática do curated.js
{
  for (const [i, t] of ALL) curatedFor(i, t);
  const c = parseChord('C'), n = chordNotes(c);
  const tCourses = courses;
  const bads = { 'nota estranha (x32210)': [-1, 3, 2, 2, 1, 0], 'baixo errado (032010)': [0, 3, 2, 0, 1, 0], 'abertura > 4 (x3201 8)': [-1, 3, 2, 0, 1, 8], 'falta a 3ª (x3x01x)': [-1, 3, -1, 0, 1, -1] };
  for (const [name, f] of Object.entries(bads)) report(`Shape inválido rejeitado: ${name}`, checkShape(f, n, tCourses) !== null, checkShape(f, n, tCourses));
  report('Shape válido aceito: C x32010', checkShape([-1, 3, 2, 0, 1, 0], n, tCourses) === null);
  report(`curated.js: ${curatedReport.valid} shapes válidos, ${curatedReport.invalid.length} descartados`, true);
  const ul = document.getElementById('curados');
  if (!curatedReport.invalid.length) ul.innerHTML = '<li class="ok">Nenhum shape descartado.</li>';
  for (const s of curatedReport.invalid) {
    const li = document.createElement('li');
    li.className = 'fail';
    li.textContent = `${s.id} · ${s.symbol} · ${s.f} — ${s.reason}`;
    ul.append(li);
  }
}

// ---------- Fase 3: Sintetizador ----------
{
  const T = (id, t) => INSTRUMENTS[id].tunings[t];
  const vv = getVoicings(parseChord('E'), 'viola', 'cebolaoMi', { max: 1 })[0];
  const played = vv.frets.filter(f => f >= 0).length;
  const vs = voicesFor(vv.frets, 'viola', T('viola', 'cebolaoMi'));
  report('Viola: cada par tocado aciona 2 vozes', vs.length === 2 * played, `${vs.length} vozes / ${played} pares`);
  const pairOk = [...new Set(vs.map(v => v.course))].every(c => {
    const [a, b] = vs.filter(v => v.course === c);
    return Math.abs(b.offset - a.offset - 0.008) < 1e-9 && Math.abs(b.cents) <= 3 && a.cents === 0;
  });
  report('Viola: 2ª corda do par com +8 ms e desafinação ≤ 3 cents', pairOk);
  const uk = voicesFor([0, 0, 0, 0], 'ukulele', T('ukulele', 'highG'));
  report('Ukulele: corda G soa acima da C (reentrante)', uk[0].midi > uk[1].midi, `G=${uk[0].midi} C=${uk[1].midi}`);
  report('Violão: 1 voz por corda tocada (C x32010)', voicesFor([-1, 3, 2, 0, 1, 0], 'violao', T('violao', 'padrao')).length === 5);
  report('Clique numa corda: só ela soa', voicesFor([-1, 3, 2, 0, 1, 0], 'viola', T('viola', 'cebolaoMi'), 2).every(v => v.course === 2));

  const ks = ksSamples(110, 44100, { t60: 2, blend: 0.5, pluck: 0.5 });
  const rms = (a, b) => Math.sqrt(ks.subarray(a, b).reduce((s, x) => s + x * x, 0) / (b - a));
  const n10 = Math.floor(ks.length / 10);
  report('Karplus-Strong: amostras finitas, ≤ 1 e decaindo',
    ks.every(Number.isFinite) && ks.every(x => Math.abs(x) <= 1) && rms(ks.length - n10, ks.length) < rms(0, n10) / 100);

  const svg = renderDiagram(V('C')[0], INSTRUMENTS.violao, T('violao', 'padrao'), { onString: () => {} });
  report('Diagrama: 1 área clicável por corda tocada', svg.querySelectorAll('.hit[role="button"]').length === 5);

  if (typeof OfflineAudioContext === 'function') {
    const sr = 44100, off = new OfflineAudioContext(2, sr * 7, sr);
    setContext(off);
    let started = 0;
    for (const [id, t, sym] of [['violao', 'padrao', 'G'], ['viola', 'cebolaoMi', 'E'], ['ukulele', 'highG', 'C']]) {
      const v = getVoicings(parseChord(sym), id, t, { max: 1 })[0];
      for (let k = 0; k < 4; k++) {
        started += play(v, id, T(id, t), { mode: 'dedilhar' });
        started += play(v, id, T(id, t), { mode: 'batida' });
        started += play(v, id, T(id, t), { course: v.frets.findIndex(f => f >= 0) });
      }
    }
    report('Três modos × três instrumentos iniciam vozes', started > 0 && activeVoices() > 0, `${started} vozes; ${activeVoices()} ativas antes do render`);
    const buf = await off.startRendering();
    await new Promise(r => setTimeout(r, 200));
    let peak = 0;
    for (let c = 0; c < buf.numberOfChannels; c++) for (const x of buf.getChannelData(c)) peak = Math.max(peak, Math.abs(x));
    report('Áudio audível e sem clipping (limitador)', peak > 0.01 && peak <= 1, `pico ${peak.toFixed(3)}`);
    report('Sem vazamento: todos os nós liberados após tocar 36×', activeVoices() === 0, `${activeVoices()} vozes restantes`);
  } else {
    report('OfflineAudioContext indisponível — testes de grafo pulados', true);
  }
}

// Saída na tela
const ol = document.getElementById('resultados');
for (const r of results) {
  const li = document.createElement('li');
  li.className = r.ok ? 'ok' : 'fail';
  li.textContent = `${r.ok ? '✔' : '✘'} ${r.name}${r.detail ? ' — ' + r.detail : ''}`;
  ol.append(li);
}
const fails = results.filter(r => !r.ok).length;
const resumo = document.getElementById('resumo');
resumo.textContent = fails ? `${fails} de ${results.length} testes falharam` : `Todos os ${results.length} testes passaram ✔`;
resumo.className = fails ? 'fail' : 'ok';
window.__TEST_RESULTS__ = results;
</script>
</body>
</html>

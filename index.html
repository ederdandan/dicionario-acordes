<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dicionário de acordes para violão: busca por cifra, diagramas e análise de notas.">
  <title>Dicionário de Acordes</title>
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">Dicionário de Acordes</h1>
    <div class="search" role="search">
      <label for="busca" class="sr-only">Buscar acorde</label>
      <input id="busca" type="text" autocomplete="off" spellcheck="false"
             placeholder="Buscar: Am7, F#m7(b5), Dó menor…"
             role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sugestoes">
      <ul id="sugestoes" role="listbox" class="suggestions" hidden></ul>
      <p id="busca-msg" class="search-msg" aria-live="polite"></p>
    </div>
  </header>

  <main class="layout">
    <section class="panel picker" aria-label="Escolha do acorde">
      <h2 class="panel-title">Tônica</h2>
      <div id="tonicas" class="root-grid" role="group" aria-label="Tônicas"></div>
      <div id="abas" class="tabs" role="tablist" aria-label="Tipos de acorde"></div>
      <div id="tipos" class="type-grid" role="tabpanel"></div>
    </section>

    <section class="panel viewer" aria-label="Diagrama">
      <div class="chord-head">
        <h2 id="acorde-simbolo" class="chord-symbol">—</h2>
        <p id="acorde-nome" class="chord-name"></p>
      </div>
      <div id="diagrama" class="diagram-main"></div>
      <p id="posicao-rotulo" class="voicing-label"></p>
      <div class="pos-nav">
        <button id="anterior" type="button" class="btn" aria-label="Posição anterior">◀</button>
        <span id="posicao-contador" class="pos-count" aria-live="polite">Posição 0/0</span>
        <button id="proxima" type="button" class="btn" aria-label="Próxima posição">▶</button>
      </div>
      <div id="miniaturas" class="thumbs" role="group" aria-label="Posições"></div>
    </section>

    <section class="panel analysis" aria-label="Análise">
      <h2 class="panel-title">Análise</h2>
      <dl class="facts">
        <dt>Notas</dt><dd id="analise-notas"></dd>
        <dt>Fórmula</dt><dd id="analise-formula"></dd>
      </dl>
      <table class="string-table">
        <caption class="sr-only">Corda a corda</caption>
        <thead><tr><th scope="col">Corda</th><th scope="col">Casa</th><th scope="col">Dedo</th><th scope="col">Nota</th></tr></thead>
        <tbody id="analise-tabela"></tbody>
      </table>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
